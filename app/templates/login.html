{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="container narrow auth">
  <div class="panel">
    <div class="eyebrow">Welcome back</div>
    <h1>Log in</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="form-actions"><button class="btn btn-primary btn-block" type="submit">Log in</button></div>
    </form>
    <p class="muted small">New here? <a class="author-name" href="{{ url_for('main.register') }}">Create an account</a></p>
    <div class="demo-creds">Lab demo accounts: <code>alice / alice-pass-123</code> · <code>bob / bob-pass-123</code> · <code>admin / admin-pass-123</code></div>
  </div>
</section>
{% endblock %}
