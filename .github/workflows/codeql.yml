name: CodeQL

# Free for public repositories. On a private repository without GitHub
# Advanced Security, results cannot be uploaded — make the repo public or
# disable this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: manual
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build native code
        if: matrix.build-mode == 'manual'
        run: make -C native clean all

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
